# 信工所招聘系统 — Nginx 站点（宝塔路径：/www/server/panel/vhost/nginx/10.28.12.15.conf）
# PROJ-002 HTTPS + PROJ-003 安全响应头 + PROJ-006 CSP + Auth-04 HTTP→HTTPS 跳转
# 部署：sudo bash scripts/apply-rms-nginx-site.sh

# Auth-04：HTTP 仅保留证书校验，其余 301 跳转 HTTPS
server
{
    listen 80;
    server_name 10.28.12.15;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/10.28.12.15.conf;
    #CERT-APPLY-CHECK--END

    location ~ \.well-known {
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log  /www/wwwlogs/10.28.12.15.log;
    error_log  /www/wwwlogs/10.28.12.15.error.log;
}

server
{
    listen 443 ssl http2;
    server_name 10.28.12.15;
    index  index.html index.htm  default.htm default.html;
    root /www/wwwroot/rms/frontend/dist;

    ssl_certificate     /www/server/panel/vhost/cert/10.28.12.15/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/10.28.12.15/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # PROJ-003 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # PROJ-006：JeecgBoot Vue3 需 unsafe-inline/eval；登录页 iconfont 走 at.alicdn.com；附件图走 OSS
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://at.alicdn.com; style-src 'self' 'unsafe-inline' https://at.alicdn.com; img-src 'self' data: blob: https://*.aliyuncs.com; font-src 'self' data: https://at.alicdn.com; connect-src 'self' ws: wss:; frame-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

    #SSL-START
    #error_page 404/404.html;
    #SSL-END

    error_page 404 /index.html;

    # VULN-033：纯静态前端，勿启用 PHP
    # include enable-php-00.conf;

    include /www/server/panel/vhost/rewrite/10.28.12.15.conf;

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    location ~ \.well-known{
        allow all;
    }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    location ^~ /xgszp-boot/websocket/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /xgszp-boot/ {
        proxy_pass http://127.0.0.1:8080/xgszp-boot/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 1000m;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
        access_log off;
    }

    location /xgsbt {
        proxy_pass http://127.0.0.1:30920/xgsbt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|bmp|swf|ico|svg|woff|woff2|ttf|eot)$ {
        expires max;
        log_not_found off;
        access_log off;
        error_log /dev/null;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log  /www/wwwlogs/10.28.12.15.log;
    error_log  /www/wwwlogs/10.28.12.15.error.log;
}
